<div class="topbar">
  <a class="btn btn-secondary" routerLink="/admin/admin"
    >Volver al panel de administración</a
  >
</div>

<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-lg border-0">
      <div class="card-body p-4">
        <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
          <div class="text-center mb-4">
            <img
              src="/assets/images/LOGO.png"
              alt="Logo ULEAM"
              style="max-height: 100px"
            />
            <h5 class="mt-3">Universidad Laica Eloy Alfaro de Manabí</h5>
          </div>

          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              formControlName="nombre"
              placeholder="Nombres y apellidos"
              required
            />
          </div>

          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              formControlName="usuario"
              placeholder="Usuario"
              required
            />
          </div>

          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              formControlName="cedula"
              placeholder="Cédula de identidad"
              required
            />
            <div
              *ngIf="
                registroForm.get('cedula')?.touched &&
                registroForm.get('cedula')?.invalid
              "
              class="text-danger small"
            >
              <span *ngIf="registroForm.get('cedula')?.errors?.['pattern']"
                >Debe tener exactamente 10 dígitos numéricos.</span
              >
            </div>
          </div>

          <div class="mb-3">
            <label for="fechaNacimiento" class="form-label"
              >Fecha de nacimiento</label
            >
            <input
              type="date"
              id="fechaNacimiento"
              class="form-control"
              formControlName="fecha_nacimiento"
              required
            />
          </div>

          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              formControlName="carrera"
              placeholder="Carrera"
              required
            />
          </div>

          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              formControlName="direccion"
              placeholder="Dirección"
            />
          </div>

          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              formControlName="telefono"
              placeholder="Teléfono"
              required
            />
            <div
              *ngIf="
                registroForm.get('telefono')?.touched &&
                registroForm.get('telefono')?.invalid
              "
              class="text-danger small"
            >
              <span *ngIf="registroForm.get('telefono')?.errors?.['required']"
                >Este campo es obligatorio.</span
              >
              <span *ngIf="registroForm.get('telefono')?.errors?.['pattern']"
                >Debe tener exactamente 10 dígitos numéricos.</span
              >
            </div>
          </div>

          <div class="mb-3">
            <input
              type="email"
              class="form-control"
              formControlName="correo"
              placeholder="Correo electrónico"
              required
            />
          </div>

          <div class="mb-3">
            <input
              type="password"
              class="form-control"
              formControlName="contrasena"
              placeholder="Contraseña"
              required
            />
          </div>

          <div class="mb-3">
            <input
              type="password"
              class="form-control"
              formControlName="confirmar_contrasena"
              placeholder="Confirmar contraseña"
              required
            />
          </div>

          <div class="mb-3">
            <label for="fechaGraduacion" class="form-label"
              >Fecha de graduación</label
            >
            <input
              type="date"
              id="fechaGraduacion"
              class="form-control"
              formControlName="fecha_graduacion"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Registrar usuario
          </button>

          <p *ngIf="mensaje" class="text-center mt-3 text-success">
            {{ mensaje }}
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
