<div class="topbar">
  <a class="btn btn-secondary" routerLink="/admin/admin"
    >Volver al panel de administración</a
  >
</div>

<div class="container mt-4">
  <h1 class="mb-4">Gestión de Encuestas</h1>

  <!-- Botón para mostrar formulario -->
  <button
    class="btn btn-primary mb-3"
    (click)="mostrarCrearEncuesta()"
    *ngIf="!mostrandoCrear"
  >
    Crear Encuesta
  </button>

  <!-- Formulario de creación -->
  <div *ngIf="mostrandoCrear" class="card mb-4">
    <div class="card-body">
      <h4 class="card-title">Crear Nueva Encuesta</h4>
      <form [formGroup]="crearForm" (ngSubmit)="crearEncuesta()">
        <div class="mb-3">
          <input
            type="text"
            class="form-control"
            formControlName="titulo"
            placeholder="Título de la encuesta"
            required
          />
        </div>
        <div class="mb-3">
          <textarea
            class="form-control"
            formControlName="descripcion"
            placeholder="Descripción de la encuesta"
          ></textarea>
        </div>
        <button class="btn btn-success me-2" type="submit">Guardar</button>
        <button
          class="btn btn-outline-secondary"
          type="button"
          (click)="cancelarCrear()"
        >
          Cancelar
        </button>
      </form>
    </div>
  </div>

  <!-- Encuestas existentes -->
  <h3>Encuestas creadas</h3>
  <ul class="list-group mb-4">
    <li
      *ngFor="let encuesta of encuestas"
      class="list-group-item d-flex justify-content-between align-items-center"
    >
      <div>
        <strong>{{ encuesta.titulo }}</strong
        ><br />
        <small>{{ encuesta.descripcion }}</small>
      </div>
      <div>
        <button
          class="btn btn-warning btn-sm me-2"
          (click)="editarEncuesta(encuesta)"
        >
          Editar
        </button>
        <button
          class="btn btn-danger btn-sm"
          (click)="eliminarEncuesta(encuesta.id)"
        >
          Eliminar
        </button>
      </div>
    </li>
  </ul>

  <!-- Formulario de edición -->
  <div *ngIf="mostrandoEdicion" class="card">
    <div class="card-body">
      <h4 class="card-title">Editar Encuesta</h4>
      <form [formGroup]="editarForm" (ngSubmit)="guardarEdicion()">
        <div class="mb-3">
          <input
            type="text"
            class="form-control"
            formControlName="titulo"
            placeholder="Título encuesta"
            required
          />
        </div>
        <div class="mb-3">
          <textarea
            class="form-control"
            formControlName="descripcion"
            placeholder="Descripción encuesta"
          ></textarea>
        </div>
        <button class="btn btn-success me-2" type="submit">
          Guardar cambios
        </button>
        <button
          class="btn btn-outline-secondary"
          type="button"
          (click)="cancelarEdicion()"
        >
          Cancelar
        </button>
      </form>
    </div>
  </div>
</div>
