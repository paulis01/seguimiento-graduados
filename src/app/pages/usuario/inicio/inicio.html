<div class="d-flex flex-column min-vh-100 bg-light">
  <header class="bg-success text-white py-2 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a
        class="btn btn-outline-light btn-sm"
        href="https://www.uleam.edu.ec/"
        target="_blank"
      >
        Sitio de la ULEAM
      </a>
      <div class="d-flex gap-2">
        <a class="btn btn-light btn-sm" [routerLink]="['/usuario/perfil']">Perfil</a>
        <button class="btn btn-outline-light btn-sm" (click)="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="container my-5 flex-grow-1">
    <h1 class="mb-4 text-success">Encuestas ULEAM</h1>
    <h2 class="h5 mb-4">Encuestas disponibles</h2>

    <ul *ngIf="encuestas.length > 0; else sinEncuestas" class="list-group shadow-sm">
      <li
        *ngFor="let encuesta of encuestas"
        class="list-group-item d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center p-3"
      >
        <div>
          <h3 class="h6 text-primary fw-bold">{{ encuesta.titulo }}</h3>
          <p class="mb-2 mb-md-0 text-muted">{{ encuesta.descripcion }}</p>
        </div>
        <button
          class="btn btn-outline-primary btn-sm mt-2 mt-md-0"
          (click)="contestarEncuesta(encuesta.id)"
        >
          Contestar
        </button>
      </li>
    </ul>

    <ng-template #sinEncuestas>
      <div class="alert alert-warning mt-3" role="alert">
        No hay encuestas disponibles por el momento.
      </div>
    </ng-template>
  </main>
</div>
