<div class="topbar mb-3">
  <a class="btn btn-success" routerLink="/admin/admin">
    Volver al panel de administración
  </a>
</div>

<div class="container">
  <h1 class="mb-4">Respuestas por Encuesta</h1>

  <div
    *ngIf="agrupadas.length > 0; else sinRespuestas"
    class="accordion"
    id="acordeonEncuestas"
  >
    <div *ngFor="let grupo of agrupadas; let i = index" class="accordion-item">
      <h2 class="accordion-header" id="encuesta{{ i }}">
        <button
          class="accordion-button collapsed"
          type="button"
          data-bs-toggle="collapse"
          [attr.data-bs-target]="'#collapse' + i"
          aria-expanded="false"
          [attr.aria-controls]="'collapse' + i"
        >
          {{ grupo.encuesta }}
          <span class="ms-auto badge bg-secondary"
            >{{ grupo.respuestas.length }} respuestas</span
          >
        </button>
      </h2>
      <div
        [id]="'collapse' + i"
        class="accordion-collapse collapse"
        [attr.aria-labelledby]="'encuesta' + i"
        data-bs-parent="#acordeonEncuestas"
      >
        <div class="accordion-body">
          <ul class="list-group mb-3">
            <li *ngFor="let item of grupo.respuestas" class="list-group-item">
              <div class="d-flex justify-content-between">
                <strong>{{ item.usuario }}</strong>
                <small class="text-muted">{{
                  item.fecha | date : "short"
                }}</small>
              </div>
              <div class="fst-italic mt-1">“{{ item.respuesta }}”</div>
            </li>
          </ul>
          <button
            class="btn btn-outline-danger btn-sm"
            (click)="eliminarEncuesta(grupo.encuesta)"
          >
            🗑️ Eliminar esta encuesta
          </button>
        </div>
      </div>
    </div>
  </div>

  <ng-template #sinRespuestas>
    <p class="text-center text-muted fst-italic">
      No hay respuestas registradas.
    </p>
  </ng-template>
</div>
